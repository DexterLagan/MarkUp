name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx tauri build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: MarkUp v${{ github.ref_name }}
          fail_on_empty: false
          body: |
            First release of **MarkUp** — a minimal, fast, native-feel markdown editor with live preview, built with Tauri 2, CodeMirror 6, and remarkable.

            - Split view: source editor on the left, live-rendered preview on the right
            - Full GFM markdown (tables, task lists, strikethrough) with code highlighting (~190 languages)
            - Open/save `.md` files (`⌘N` / `⌘O` / `⌘S`), drag & drop, and double-clicking a document in Finder
            - Light/dark themes that follow the system, with an unsaved-changes indicator

            ### Downloads

            | Asset | Platform |
            | --- | --- |
            | `MarkUp_1.0.1_aarch64.dmg` | macOS (Apple Silicon) |
            | `MarkUp_1.0.1_x64-setup.exe` | Windows x64 (NSIS installer) |
            | `MarkUp_1.0.1_x64_en-US.msi` | Windows x64 (MSI) |
            | `markup_1.0.1_amd64.deb` | Debian/Ubuntu x64 |
            | `markup_1.0.1_amd64.rpm` | Fedora/RHEL x64 |

            > The macOS build is unsigned for now — on first launch, right-click the app and choose **Open**.
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build
        shell: pwsh
        run: npx tauri build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: MarkUp v${{ github.ref_name }}
          fail_on_empty: false
          body: |
            First release of **MarkUp** — a minimal, fast, native-feel markdown editor with live preview, built with Tauri 2, CodeMirror 6, and remarkable.

            - Split view: source editor on the left, live-rendered preview on the right
            - Full GFM markdown (tables, task lists, strikethrough) with code highlighting (~190 languages)
            - Open/save `.md` files (`⌘N` / `⌘O` / `⌘S`), drag & drop, and double-clicking a document in Finder
            - Light/dark themes that follow the system, with an unsaved-changes indicator

            ### Downloads

            | Asset | Platform |
            | --- | --- |
            | `MarkUp_1.0.1_aarch64.dmg` | macOS (Apple Silicon) |
            | `MarkUp_1.0.1_x64-setup.exe` | Windows x64 (NSIS installer) |
            | `MarkUp_1.0.1_x64_en-US.msi` | Windows x64 (MSI) |
            | `markup_1.0.1_amd64.deb` | Debian/Ubuntu x64 |
            | `markup_1.0.1_amd64.rpm` | Fedora/RHEL x64 |

            > The macOS build is unsigned for now — on first launch, right-click the app and choose **Open**.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx tauri build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: MarkUp v${{ github.ref_name }}
          fail_on_empty: false
          body: |
            First release of **MarkUp** — a minimal, fast, native-feel markdown editor with live preview, built with Tauri 2, CodeMirror 6, and remarkable.

            - Split view: source editor on the left, live-rendered preview on the right
            - Full GFM markdown (tables, task lists, strikethrough) with code highlighting (~190 languages)
            - Open/save `.md` files (`⌘N` / `⌘O` / `⌘S`), drag & drop, and double-clicking a document in Finder
            - Light/dark themes that follow the system, with an unsaved-changes indicator

            ### Downloads

            | Asset | Platform |
            | --- | --- |
            | `MarkUp_1.0.1_aarch64.dmg` | macOS (Apple Silicon) |
            | `MarkUp_1.0.1_x64-setup.exe` | Windows x64 (NSIS installer) |
            | `MarkUp_1.0.1_x64_en-US.msi` | Windows x64 (MSI) |
            | `markup_1.0.1_amd64.deb` | Debian/Ubuntu x64 |
            | `markup_1.0.1_amd64.rpm` | Fedora/RHEL x64 |

            > The macOS build is unsigned for now — on first launch, right-click the app and choose **Open**.
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
