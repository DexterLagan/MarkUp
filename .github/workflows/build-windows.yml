name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build
        shell: pwsh
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: MarkUp-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/*
